<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07080A" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#FF2D3F" />

    <title>Axis RolePlay - hrvatski FiveM roleplay server</title>
    <meta
      name="description"
      content="Axis RolePlay je hrvatski FiveM roleplay server. Pregledaj trgovinu, uzmi vozila, organizacije i nekretnine za credite i preuzmi ih odmah u igri."
    />
    <link rel="canonical" href="https://axisroleplay.hr/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Axis RolePlay" />
    <meta property="og:locale" content="hr_HR" />

      property="og:description"
      content="Nema respawna za reputaciju. Hrvatski FiveM server na kojem se svaka odluka pamti."

    <meta property="og:url" content="https://axisroleplay.hr/" />
    <meta property="og:image" content="https://axisroleplay.hr/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Axis RolePlay - hrvatski FiveM roleplay server" />
    <meta
      name="twitter:description"
      content="Nema respawna za reputaciju. Hrvatski FiveM server na kojem se svaka odluka pamti."
    />
    <meta name="twitter:image" content="https://axisroleplay.hr/og.jpg" />

    <!-- Preconnect only to the image host we actually use. Fonts are self-hosted. -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Axis RolePlay",
        "alternateName": "Axis RP",
        "url": "https://axisroleplay.hr/",
        "logo": "https://axisroleplay.hr/favicon.svg",
        "description": "Hrvatski FiveM roleplay server. Trgovina s vozilima, organizacijama i nekretninama koje se preuzimaju u igri.",
        "areaServed": "HR",
        "knowsLanguage": ["hr"],
        "sameAs": [
          "https://discord.gg/axisroleplay",
          "https://www.tiktok.com/@axisroleplay",
          "https://www.instagram.com/axisroleplay"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer support",
          "availableLanguage": ["hr"],
          "url": "https://axisroleplay.hr/podrska"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

</html>
